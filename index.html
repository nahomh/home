    <style>
        body {
            font-family: 'Roboto Slab', serif;
            color: #333;
        }

        /* Skip link for keyboard users */
        .skip-to-content {
            position: absolute;
            left: -999px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .skip-to-content:focus {
            position: static;
            width: auto;
            height: auto;
            padding: 0.5rem 1rem;
            background: #fff;
            color: #000;
            z-index: 1000;
        }

        .masthead {
            background-image: linear-gradient(to bottom, rgba(47, 79, 79, 0.8), rgba(47, 79, 79, 0.8)), url('assets/background.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            padding: 100px 0;
            color: white;
            text-align: center;
            animation: fadeInBackground 2s ease-in-out;
            min-height: 100vh;
        }

        @keyframes fadeInBackground {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .site-heading h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2.25rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .subheading {
            font-family: 'Roboto Slab', serif;
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            gap: 32px;
        }

        .social-links a {
            color: white;
            font-size: 1.75rem;
            transition: transform 0.3s ease, opacity 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            transform: translateY(-5px);
            opacity: 0.8;
            color: white;
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .masthead {
                animation: none;
            }

            .social-links a {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <a class="skip-to-content" href="#main">Skip to main content</a>

                            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </header>
</body>
